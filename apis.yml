apis:
- aid: 1more:1more-storefront-agent-commerce
  name: 1MORE Storefront Agent Commerce (UCP/MCP)
  description: The agent-facing commerce interface 1MORE serves from its own US storefront host. A Universal
    Commerce Protocol merchant profile at /.well-known/ucp declares the supported UCP versions, services
    and payment handlers under merchant name "1MORE"; a remote MCP endpoint at https://usa.1more.com/api/ucp/mcp
    answers tools/list anonymously with 13 tools (catalog search/lookup/product detail, cart, checkout
    and order) carrying real JSON Schema 2020-12 input schemas. Read-only product JSON is available at
    /products.json and /collections/{handle}/products.json. The implementation is Shopify's UCP/MCP stack
    operating under 1MORE's domain and merchant identity; checkout requires contemporaneous buyer approval.
  humanURL: https://usa.1more.com/agents.md

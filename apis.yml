aid: 1more
name: 1MORE
description: 1MORE (万魔声学 / 1MORE Acoustics Technology Co., Ltd., founded 2013, with operations in China,
  the United States and the United Kingdom) is a consumer audio brand that designs and sells wired and
  wireless earbuds, on-ear and over-ear headphones, open-ear sport earbuds and companion mobile apps.
  1MORE publishes no developer program or public product API. Its machine-readable surface is its own
  direct-to-consumer storefront at usa.1more.com, which serves an agent-facing llms.txt/agents.md, a Universal
  Commerce Protocol (UCP) merchant profile at /.well-known/ucp, an anonymous remote MCP endpoint at /api/ucp/mcp
  exposing 13 catalog, cart, checkout and order tools, OAuth 2.0 / OpenID Connect discovery documents
  for Shopify customer accounts, and read-only JSON product endpoints. That surface is Shopify's UCP implementation
  running under 1MORE's own domain and merchant identity.

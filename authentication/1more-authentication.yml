note: >-
  1MORE publishes no developer API and therefore no API-key programme. Two distinct
  auth postures exist on its storefront host and they should not be conflated. (1) The
  agent commerce surface - the MCP endpoint at /api/ucp/mcp and the read-only product
  JSON endpoints - is ANONYMOUS: tools/list, initialize, /products.json and
  /collections/{handle}/products.json all answered HTTP 200 with no credentials on
  2026-09-05. Authorization for a purchase is not a token; it is a contemporaneous
  human buyer approval at the payment step, stated in the store's own agents.md.
  (2) Shopper accounts use OAuth 2.0 authorization-code + PKCE against Shopify's
  customer-account authorization server, discovered from RFC 8414 / OIDC metadata
  served on 1MORE's own host but issued by shopify.com on 1MORE's behalf.
